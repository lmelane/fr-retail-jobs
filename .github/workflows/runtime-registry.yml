name: Runtime registry
on:
  push:
    branches: [development]
    paths: [.github/workflows/runtime-registry.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Inspect the two runtime package permissions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in catwalks-catalogue-api catwalks-ingestion-worker; do
            gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/$package" \
              --jq '{name,visibility,created_at,updated_at,version_count,repository:.repository.full_name}'
            gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/$package/versions" \
              --jq '[.[]|{id,name,created_at,tags:.metadata.container.tags}]'
          done
