# CI (audit O-02) : typecheck + unitaires + intégration (Postgres de service)
# + API. Le merge vers main est bloqué si rouge — la « boucle obligatoire par
# correctif » de CLAUDE.md, enfin outillée.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  aggregator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: catwalks
          POSTGRES_PASSWORD: catwalks
          # Le garde de setup-integration refuse toute base dont le nom ne
          # contient pas « test » — les tests d'intégration VIDENT la base.
          POSTGRES_DB: catwalks_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catwalks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://catwalks:catwalks@localhost:5432/catwalks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - name: Audit des dépendances (high/critical)
        run: npm audit --audit-level=high
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - name: Pause des entrypoints réels (sans base ni réseau)
        run: node --test apps/aggregator/scripts/ops/tests/pipeline-pause.test.mjs
      - name: Contrat des deux runtimes
        run: node --test packages/runtime/test.mjs
      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
      - name: Application layout
        run: npm run check:layout -w @catwalks/aggregator
      - name: Typecheck application and maintained scripts
        run: npm run typecheck -w @catwalks/aggregator
      - name: Tests unitaires
        run: npm run test:unit -w @catwalks/aggregator
      - name: Tests d'intégration
        run: npm run test:integration -w @catwalks/aggregator
      - name: Outils Railway (hors ligne)
        run: python3 -B -m unittest discover -s apps/aggregator/scripts/ops/tests
      - name: Évaluation et seuils de recherche (hors ligne)
        run: python3 -B -m unittest discover -s apps/api/scripts/search-benchmark -p 'test_*.py'
      # Le garde de couverture, en mode reproductible : il s'exécute contre le Postgres de
      # service (migré, VIDE), jamais contre la production. Il vérifie donc la MÉCANIQUE — la
      # requête tourne contre le schéma réel, l'expression mesurée est valide, le registre est
      # lisible — et dit explicitement qu'aucun chiffre n'a été comparé.
      # La mesure du corpus est un diagnostic sans seuil de décision produit :
      #   python3 apps/aggregator/scripts/ops/db.py readonly npx tsx \
      #     apps/aggregator/scripts/ops/verif-couverture-registre.mts
      - name: Garde de couverture (mécanique, base vide)
        run: npm run verif:couverture -w @catwalks/aggregator -- --ci

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: catwalks
          POSTGRES_PASSWORD: catwalks
          POSTGRES_DB: catwalks_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catwalks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://catwalks:catwalks@localhost:5432/catwalks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: Tests unitaires api
        run: npx vitest run lib
        working-directory: apps/api
      - name: Build
        run: npm run build -w @catwalks/api
      # D-420 — les parcours e2e (recherche, fiche, 404/410, CTAs) testaient
      # les PAGES de Mode Careers, supprimées avec le rendu. Ils ne sont pas
      # abandonnés : leurs équivalents vivent désormais sur catwalks.io, qui
      # porte ces parcours. Ce service n'a plus de page à parcourir.

  runtime-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && contains(github.event.head_commit.message, '[runtime-images]')
    needs: [aggregator, api]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: runtime-image-${{ github.sha }}-${{ matrix.name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: catwalks-catalogue-api
            dockerfile: apps/api/Dockerfile
            root: /app
          # D-444 : catwalks-direct-sync tourne sur cette même image (`imageOf` dans le contrat) ; verify-image.mjs
          # l'y démarre aussi, hors réseau, en pause, avec sa commande. Aucun paquet supplémentaire n'est publié.
          - name: catwalks-ingestion-worker
            dockerfile: apps/aggregator/Dockerfile
            root: /repo
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate registry publisher
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build once, publish immutable image and verify embedded release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          RUNTIME_ROOT: ${{ matrix.root }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${RUNTIME_NAME}:${GITHUB_SHA}"
          package_path="users/$GITHUB_REPOSITORY_OWNER/packages/container/$RUNTIME_NAME"
          # Public runtime packages are explicitly approved by the owner.
          if gh api "$package_path" > package.json.tmp 2> package-error.txt; then
            python3 -c 'import json; assert json.load(open("package.json.tmp"))["visibility"] == "public", "Runtime package visibility differs from approved public target"'
          elif ! grep -q 'HTTP 404' package-error.txt; then
            cat package-error.txt >&2
            exit 1
          fi
          manifest_error=$(mktemp)
          if docker manifest inspect "$image" >/dev/null 2>"$manifest_error"; then
            docker pull "$image"
          else
            # A registry/auth/network failure does not authorize another build.
            if ! grep -Eqi 'manifest unknown|no such manifest|MANIFEST_UNKNOWN' "$manifest_error"; then
              cat "$manifest_error" >&2
              exit 1
            fi
            docker build --platform linux/amd64 --build-arg "CATWALKS_BUILD_SHA=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -f "$DOCKERFILE" -t "$image" .
            docker push "$image"
          fi
          # Verify actual visibility; login only authorizes publication.
          gh api "$package_path" > package.json.tmp
          python3 -c 'import json; assert json.load(open("package.json.tmp"))["visibility"] == "public", "Published runtime package visibility differs from approved public target"'
          docker run --rm --network=none --entrypoint cat "$image" "$RUNTIME_ROOT/packages/runtime/release.json" > embedded-release.json
          docker image inspect "$image" > image-inspect.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          receipt = json.loads(pathlib.Path('embedded-release.json').read_text())
          assert receipt['gitSha'] == os.environ['GITHUB_SHA']
          assert receipt['contractSha256'] == hashlib.sha256(pathlib.Path('docs/operations/railway/runtime-target.json').read_bytes()).hexdigest()
          image = json.loads(pathlib.Path('image-inspect.json').read_text())[0]
          assert image['Architecture'] == 'amd64'
          assert len(image['RepoDigests']) == 1
          receipt.update(service=os.environ['RUNTIME_NAME'], image=image['RepoDigests'][0], imageId=image['Id'],
                         imageEnvironment=image['Config']['Env'], profiles=[p['name'] for p in json.loads(pathlib.Path('docs/operations/railway/runtime-target.json').read_text())['profiles']])
          pathlib.Path('runtime-image.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Start the exact image offline (no database or external access)
        run: node packages/runtime/verify-image.mjs runtime-image.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-${{ matrix.name }}
          path: runtime-image.json
          retention-days: 90
