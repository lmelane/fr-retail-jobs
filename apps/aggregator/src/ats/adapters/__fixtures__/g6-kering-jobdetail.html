      }</script></head><body><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"description":"<p><b>ROLE</b><br /> </p><p>Dans le cadre du développement du contrôle de gestion siège, nous recherchons un contrôleur de gestion. Rattaché au contrôleur de gestion siège-fonctions supports, vos missions seront axées sur l’analyse et le suivi des budgets du siège (DSI, Warehouse, Travels, Delivieries….).</p><p>Vous intègrerez le service contrôle de gestion Siège (5 personnes) au sein du département contrôle financier (20 personnes). Interlocuteur privilégié des équipes opérationnelles en central, vous serez en relation avec les différentes directions et le service comptabilité. Vous évoluerez dans un contexte dynamique et multiculturel.</p><p></p><p><b>MISSION</b></p><ul><li>Elaboration des budgets et prévisions en collaboration avec les opérationnels du siège.</li><li>Réalisation des clôtures mensuelles sur le périmètre indiqué : analyse de la comptabilité, remontée des chiffres dans le logiciel de consolidation, analyse des écarts vs prévisionnel et production d’un reporting mensuel à destination du CFO.</li><li>Formalisation et vérification de la bonne application des procédures.</li><li>Accompagnement des opérationnels dans l’utilisation de l’outil de gestion des achats.</li></ul><p></p><p><b>PROFIL</b></p><ul><li>Formation supérieure Bac&#43;5 (Grandes Ecoles ou Universités),</li><li>Une première expérience significative en contrôle de gestion est demandée,</li><li>Maîtrise d&#39;Excel,</li><li>Langues de travail : français et anglais</li><li>La connaissance de SAP serait un plus,</li><li>Rigueur, implication et sens de l’organisation,</li><li>Bon relationnel et esprit d’équipe,</li><li>Bonnes capacités de synthèse et aisance avec les données chiffrées.</li></ul><p></p><p><i>Saint Laurent s&#39;engage à créer une main-d&#39;œuvre diversifiée. Nous croyons que la diversité sous toutes ses formes - genre, âge, nationalité, culture, croyances religieuses et orientation sexuelle - enrichit le lieu de travail. Cela ouvre des opportunités aux personnes d&#39;exprimer leurs talents, à la fois individuellement et collectivement, et cela contribue à renforcer notre capacité d&#39;adaptation à un monde en mutation. En tant qu&#39;employeur de l&#39;égalité des chances, nous accueillons et considérons les candidatures de tous les candidats qualifiés, indépendamment de leurs antécédents</i></p>","summary":"A PROPOS DE SAINT LAURENT \n\nFondée en 1961, Yves Saint Laurent a été la première maison de couture à lancer le concept du prêt-à-porter de luxe en créant, en 1966, la ligne ‘Rive Gauche’, synonyme de jeunesse et de liberté. Ce changement a représenté un premier pas crucial dans la modernisation de la mode et a révolutionné le paysage socio-culturel. \nEn 1999, la division luxe du Groupe Kering a acquis la maison Yves Saint Laurent et, sous la direction créative d’Anthony Vaccarello depuis avril 2016, continue à la positionner au sommet de l’univers du luxe. \nAujourd’hui, les collections Saint Laurent incluent le prêt-à-porter féminin et masculin, les chaussures, les sacs, la petite maroquinerie, les bijoux, les foulards et les cravates."}}}</script></body></html>
